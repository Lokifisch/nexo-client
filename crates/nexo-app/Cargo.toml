[package]
name = "nexo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Minecraft client for Nexo"

[[bin]]
name = "nexo"
path = "src/main.rs"

[dependencies]
nexo-core.workspace = true

# `tokio` feature so iced drives our async core on a tokio runtime;
# `advanced` for custom widget styling; `canvas` for the live-log pulse, which
# draws expanding rings that no combination of styled containers can express.
iced = { version = "0.14.0", features = [
    "tokio",
    "advanced",
    "image",
    "svg",
    "lazy",
    "canvas",
] }

tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Opens the Microsoft sign-in page in the user's default browser.
open = "5"
glam = "0.33.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
# `xdg-portal` is a Linux-only feature of rfd: the deps it pulls sit behind a
# Linux `[target]` table upstream, so it is inert on Windows and the Win32
# backend is used there. `common-controls-v6` gives the Windows dialogs the
# modern visual style.
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "tokio",
    "common-controls-v6",
] }

# Not `[target.'cfg(windows)'.build-dependencies]`: build-dependency target
# tables are evaluated against the *host*, so that spelling would drop this
# when cross-compiling from Linux — exactly the case that needs it. The build
# script checks the target itself instead.
[build-dependencies]
winresource = "0.1"
