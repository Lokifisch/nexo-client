[package]
name = "nexo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Minecraft client for Nexo"

[[bin]]
name = "nexo"
path = "src/main.rs"

[dependencies]
nexo-core.workspace = true

# `tokio` feature so iced drives our async core on a tokio runtime;
# `advanced` for custom widget styling.
iced = { version = "0.14.0", features = ["tokio", "advanced", "image", "svg", "lazy"] }

tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Opens the Microsoft sign-in page in the user's default browser.
open = "5"
