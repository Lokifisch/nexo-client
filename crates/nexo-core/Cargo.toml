[package]
name = "nexo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Instance management, auth, and content APIs for the Nexo client"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
uuid.workspace = true
sha1.workspace = true
hex.workspace = true
zip.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
aes-gcm = "0.11.0"
sha2.workspace = true
# Release-tag ordering for the self-updater. Getting prerelease precedence
# wrong here would offer 0.2.0-alpha to someone already running 0.2.0.
semver = "1"
# Adoptium ships JVMs as .tar.gz everywhere except Windows, where it is a .zip
# the `zip` dependency above already covers.
tar = "0.4"
flate2 = "1"
# SRV lookups for the server-list ping. Minecraft resolves
# `_minecraft._tcp.<host>` before falling back to A/AAAA, and most real servers
# rely on it — `minehut.gg` has no A record at all, and `hypixel.net` points at
# a web host with 25565 closed. Hand-rolling the query would mean discovering
# the system nameserver on Windows too, which is the part this earns its place
# for. `system-config` keeps DNS on the resolver the machine is already using
# rather than sending the player's server list to a public one.
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "system-config",
    "tokio",
] }

[dev-dependencies]
reqwest.workspace = true
# Only to hand-build a response for the rate-limit tests. reqwest already
# depends on it, so this pins no new tree.
http = "1"
uuid = { workspace = true, features = ["v4"] }
