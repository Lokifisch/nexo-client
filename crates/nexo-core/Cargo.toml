[package]
name = "nexo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Instance management, auth, and content APIs for the Nexo client"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
uuid.workspace = true
sha1.workspace = true
hex.workspace = true
zip.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
aes-gcm = "0.11.0"
sha2.workspace = true
# Release-tag ordering for the self-updater. Getting prerelease precedence
# wrong here would offer 0.2.0-alpha to someone already running 0.2.0.
semver = "1"
# Adoptium ships JVMs as .tar.gz everywhere except Windows, where it is a .zip
# the `zip` dependency above already covers.
tar = "0.4"
flate2 = "1"

[dev-dependencies]
reqwest.workspace = true
# Only to hand-build a response for the rate-limit tests. reqwest already
# depends on it, so this pins no new tree.
http = "1"
uuid = { workspace = true, features = ["v4"] }
