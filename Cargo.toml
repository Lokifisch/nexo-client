[workspace]
resolver = "3"
members = ["crates/nexo-core", "crates/nexo-app"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Lokifisch/nexo-client"

[workspace.dependencies]
nexo-core = { path = "crates/nexo-core" }

# Async runtime + HTTP. rustls rather than native-tls so Windows/Linux
# builds don't need a system OpenSSL.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# A GUI app ships as one binary; trading compile time for size/speed is
# worth it here.
lto = "thin"
codegen-units = 1
strip = "symbols"
